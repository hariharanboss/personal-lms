name = "personal-lms"
main = "worker.js"
compatibility_date = "2024-01-01"

[build]
command = "node build.js"

[[kv_namespaces]]
binding = "FILES_DB"
id = "your-kv-namespace-id"

[env.production]
name = "personal-lms"

[[env.production.kv_namespaces]]
binding = "FILES_DB"
id = "your-kv-namespace-id"

[env.development]
name = "personal-lms-dev"

[[env.development.kv_namespaces]]
binding = "FILES_DB"
id = "your-kv-namespace-id"
